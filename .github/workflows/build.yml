name: Android CI Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: wallwidgy-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    # Publish every successful build as a GitHub Release so the APK is always
    # downloadable without digging through workflow artifacts.
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Wallwidgy build ${{ github.run_number }}
        body: |
          Automated build of `${{ github.sha }}` from `${{ github.ref_name }}`.

          Commit: ${{ github.event.head_commit.message }}
        files: app/build/outputs/apk/debug/app-debug.apk
        generate_release_notes: false
        prerelease: false
        make_latest: true
